<!doctype html><html><head><meta charset="utf-8"><title>Paper Reading Helper settings</title><style>body{max-width:680px;margin:48px auto;padding:0 20px;font:14px/1.5 system-ui;color:#222}label{display:block;font-weight:700;margin:18px 0 6px}input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px}button{margin-top:20px;padding:10px 16px;border:0;border-radius:8px;background:#222;color:#fff}.note{color:#666}#saved{margin-left:10px;color:#527782}</style></head><body><h1>Paper Reading Helper</h1><p class="note">Use local analysis while developing, or point the extension at the PRH backend. Do not put model-provider secret keys in the extension.</p><label for="mode">Analysis mode</label><select id="mode"><option value="mock">Local prototype</option><option value="api">PRH API</option></select><label for="url">PRH API base URL</label><input id="url" type="url" placeholder="https://api.example.com"><button id="save">Save</button><span id="saved"></span><script type="module" src="options.js"></script></body></html>
